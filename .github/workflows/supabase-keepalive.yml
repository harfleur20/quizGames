name: Supabase Keepalive

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://darzscuvrvvguljtuwhg.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhcnpzY3V2cnZ2Z3VsanR1d2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5MzYwNDAsImV4cCI6MjA4MDUxMjA0MH0.drgwBrdS3yXsoXnL8qWFB7BYm9opdAwcN8n5CoUcYIY' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate config
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }

      - name: Ping Supabase public API
        run: |
          endpoint="${SUPABASE_URL%/}/rest/v1/scores?select=id&limit=1"
          http_code="$(curl --silent --show-error \
            --output /tmp/supabase-keepalive.json \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            --header "Prefer: count=none" \
            "$endpoint")"

          if [ "$http_code" != "200" ]; then
            echo "Supabase keepalive failed with HTTP ${http_code}"
            cat /tmp/supabase-keepalive.json
            exit 1
          fi

          echo "Supabase keepalive succeeded."
